// ArrowLab operator/developer configuration
//
// Edit only the choices in this file. The implementation that interprets
// them lives in ArrowLabConfig.h.

// Measurement processor link:
//   0 = VIEWE RX11/TX12, proven two-wire fallback (onboard SD unavailable)
//   1 = VIEWE GPIO17, production one-wire link with 4.7 kOhm pull-up
//   2 = VIEWE RX44/TX43, UNTESTED two-wire option (USB/CH340 conflict)
constexpr uint8_t CONFIGURED_MEASUREMENT_LINK_MODE = 1;

// false: reveal developer tools with the normal hidden long-press gesture.
// true:  show developer tools immediately after boot.
constexpr bool CONFIGURED_DEVELOPER_MODE_DEFAULT_ENABLED = false;
