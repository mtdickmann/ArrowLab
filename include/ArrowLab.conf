// ArrowLab operator/developer configuration
//
// Edit only the choices in this file. The implementation that interprets
// them lives in ArrowLabConfig.h.

// Measurement processor link:
//   0 = VIEWE RX11/TX12, proven two-wire fallback (onboard SD unavailable)
//   1 = VIEWE GPIO17, production one-wire link with 4.7 kOhm pull-up
//   2 = VIEWE RX44/TX43, UNTESTED two-wire option (USB/CH340 conflict)
constexpr uint8_t CONFIGURED_MEASUREMENT_LINK_MODE = 1;

// false: reveal developer tools with the normal hidden long-press gesture.
// true:  show developer tools immediately after boot.
constexpr bool CONFIGURED_DEVELOPER_MODE_DEFAULT_ENABLED = false;

// Operational weighing only. Calibration deliberately remains fixed at 30 s.
// This is the time allowed after a detected mass change before the new held
// reading is published. Keep it between 500 and 10000 milliseconds.
constexpr uint32_t CONFIGURED_OPERATIONAL_WEIGHING_TIME_MS = 1000;

// Mass display:
//   0 = grams (g)
//   1 = grains (gr)
//   2 = avoirdupois ounces (oz)
// The other two units are always shown as small secondary conversions.
constexpr uint8_t CONFIGURED_PRIMARY_MASS_UNIT = 0;

// Number of digits after the decimal point for each unit. Keeping these
// independent avoids meaningless decimal grains while retaining useful
// resolution in grams and ounces during development.
constexpr uint8_t CONFIGURED_GRAMS_DECIMAL_PLACES = 2;
constexpr uint8_t CONFIGURED_GRAINS_DECIMAL_PLACES = 0;
constexpr uint8_t CONFIGURED_OUNCES_DECIMAL_PLACES = 3;

// Automatic spine/SAS capture. The operator presses to the fixed 12.7 mm
// mechanical stop; WROOM accepts the force only after it has remained inside
// this stability band for the configured hold time. These are developer
// tuning values, not normal user preferences.
constexpr uint32_t CONFIGURED_SPINE_HOLD_TIME_MS = 3000;
constexpr float CONFIGURED_SPINE_STABILITY_BAND_GRAMS = 3.0f;
constexpr float CONFIGURED_SPINE_MINIMUM_APPLIED_FORCE_GRAMS = 250.0f;
constexpr float CONFIGURED_SPINE_RELEASE_FORCE_GRAMS = 25.0f;
constexpr uint32_t CONFIGURED_SPINE_RELEASE_TIME_MS = 500;
constexpr float CONFIGURED_ARROW_PRESENT_GRAMS = 3.0f;
constexpr uint32_t CONFIGURED_ARROW_STABILITY_TIME_MS = 1000;
